name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing in this workflow writes to the repository. The deploy job widens
# this for itself and no further.
permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      # A GitHub Pages project site serves at https://<user>.github.io/tactistl/,
      # so every asset URL needs that prefix. Vite requires both slashes.
      BASE_PATH: /tactistl/
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust with the wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        # The prebuilt binary. `cargo install wasm-pack` builds it from source,
        # which costs minutes on every cold cache for no benefit.
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: cargo test
        run: cargo test

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        working-directory: web

      # Build first: `npm run build` runs `build:wasm`, which generates
      # web/src/lib/wasm/. That directory is gitignored, and both `npm test`
      # and `npm run check` resolve imports into it, so on a fresh checkout
      # they cannot run before it exists.
      - name: npm run build
        run: npm run build
        working-directory: web

      - name: npm test
        run: npm test
        working-directory: web

      - name: npm run check
        run: npm run check
        working-directory: web

      # Built once, here, and handed to the deploy job. The alternative is a
      # second job with the whole Rust and wasm toolchain in it, building the
      # same bytes again.
      - name: Upload the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Deployments serialize; builds do not. Scoping this to the deploy job
    # rather than the workflow matters because `build-test` also runs on every
    # pull request, and a workflow-level group would queue unrelated PR builds
    # behind each other -- and cancel the queued one as soon as a third
    # arrived, showing as a failed check on a PR that was fine.
    # `cancel-in-progress: false`: a cancelled half-deploy leaves the site on
    # the previous version, so letting each finish is the simpler behaviour.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
